[package]
name = "keeweb"
version = "1.18.9"
edition = "2021"

[lib]
name = "keeweb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
active-win-pos-rs = "0.11.0"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = "0.10.3"
argon2 = { version = "0.5.3", features = ["alloc", "zeroize"], default-features = false }
cbc = { version = "0.1", features = ["std"] }
challenge_response = "0.5.46"
enigo = "0.6.1"
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify = "8"
nusb = { version = "0.2.7", features = ["tokio"] }
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.8"
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.4"
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "time"] }
ureq = "3"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSString", "block2"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAError"] }
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "2.17.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
