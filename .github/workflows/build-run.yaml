name: Build releases

on:
    push:
        tags: ['*']

permissions:
    contents: read

jobs:
    web:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - name: Install dependencies
              run: npm ci --no-audit --no-fund
            - name: Test web app
              run: npm test
            - name: Build web app
              run: npm run build-legacy
            - name: Upload web app
              uses: actions/upload-artifact@v4
              with:
                  name: KeeWeb-${{ github.ref_name }}.html
                  path: dist
                  if-no-files-found: error
            - name: Check on VirusTotal
              if: github.repository == 'keeweb/keeweb'
              env:
                  VIRUS_TOTAL: ${{ secrets.VIRUS_TOTAL }}
              run: |
                  mkdir -p keys
                  printf '%s' "$VIRUS_TOTAL" > keys/virus-total.json
                  npx grunt virustotal

    desktop:
        needs: web
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      target: aarch64-apple-darwin
                      bundles: dmg
                    - platform: macos-latest
                      target: x86_64-apple-darwin
                      bundles: dmg
                    - platform: windows-latest
                      target: x86_64-pc-windows-msvc
                      bundles: nsis
                    - platform: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      bundles: deb,appimage
        runs-on: ${{ matrix.platform }}
        env:
            CARGO_BUILD_TARGET: ${{ matrix.target }}
            PUPPETEER_SKIP_DOWNLOAD: 'true'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libudev-dev libxdo-dev libxtst-dev libx11-dev
            - name: Install frontend dependencies
              run: npm ci --no-audit --no-fund
            - name: Build and upload desktop bundles
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
                  APPLE_ID: ${{ secrets.APPLE_ID_USERNAME }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_DEPLOY_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: KeeWeb ${{ github.ref_name }}
                  releaseDraft: true
                  generateReleaseNotes: true
                  includeUpdaterJson: false
                  args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
